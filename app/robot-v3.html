<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Robot AI — 3D Humanoid</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#eef3ff;font-family:system-ui,sans-serif}#scene{width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 0 28%,rgba(4,7,15,.25) 70%,rgba(0,0,0,.55));}header{position:absolute;top:0;left:0;right:0;padding:18px 20px;display:flex;justify-content:space-between;letter-spacing:.14em;font-size:12px;text-transform:uppercase}header b{font-size:16px;letter-spacing:.08em}#status{color:#75f0b1}.controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.controls button{border:1px solid #33466b;background:rgba(8,13,25,.78);color:#eef3ff;border-radius:14px;padding:11px 15px}.hint{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);font-size:11px;color:#7f8ba5;white-space:nowrap}</style></head><body><canvas id="scene"></canvas><div id="ui"><header><div><b>ROBOT AI</b><br><span>HUMANOID CORE / V3</span></div><div id="status">● LOADING 3D</div></header><div class="hint">Robotni aylantirish uchun suring · pinch bilan zoom</div><div class="controls"><button id="female">QIZ OVOZI</button><button id="male">ERKAK OVOZI</button><button id="talk">SALOM</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script><script>const c=document.getElementById('scene'),r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;r.shadowMap.enabled=true;const s=new THREE.Scene();s.background=new THREE.Color(0x05070d);const cam=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.05,100);cam.position.set(0,1.1,6);s.add(new THREE.HemisphereLight(0xbdd3ff,0x080b14,2.4));const key=new THREE.DirectionalLight(0xffffff,4);key.position.set(3,5,5);key.castShadow=true;s.add(key);const rim=new THREE.PointLight(0x347cff,35,12);rim.position.set(-3,2,2);s.add(rim);const fill=new THREE.PointLight(0xa65cff,18,10);fill.position.set(3,1,-2);s.add(fill);const floor=new THREE.Mesh(new THREE.CircleGeometry(3,64),new THREE.MeshStandardMaterial({color:0x091226,metalness:.4,roughness:.45,transparent:true,opacity:.8}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.45;floor.receiveShadow=true;s.add(floor);const grid=new THREE.GridHelper(8,32,0x23406f,0x111c32);grid.position.y=-1.44;grid.material.transparent=true;grid.material.opacity=.28;s.add(grid);const root=new THREE.Group();root.position.y=-1.25;s.add(root);let mixer,robot,dist=6,rx=0,ry=0,drag=false,lx=0,ly=0,clock=new THREE.Clock();const loader=new THREE.GLTFLoader();loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',g=>{robot=g.scene;robot.scale.setScalar(1.25);robot.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});root.add(robot);mixer=new THREE.AnimationMixer(robot);const idle=g.animations.find(a=>/idle/i.test(a.name))||g.animations[0];if(idle)mixer.clipAction(idle).play();document.getElementById('status').textContent='● 3D ONLINE'},undefined,()=>document.getElementById('status').textContent='● MODEL ERROR');c.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lx)*.006;rx+=(e.clientY-ly)*.003;rx=Math.max(-.7,Math.min(.7,rx));lx=e.clientX;ly=e.clientY});c.addEventListener('pointerup',()=>drag=false);let td=0;c.addEventListener('touchstart',e=>{if(e.touches.length===2)td=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});c.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);dist=Math.max(3,Math.min(9,dist-(d-td)*.008));td=d}},{passive:true});function say(t,p){if(!speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='uz-UZ';u.rate=.92;u.pitch=p;speechSynthesis.cancel();speechSynthesis.speak(u)}female.onclick=()=>say('Salom. Men Robot AI man. Sizga qanday yordam bera olaman?',1.08);male.onclick=()=>say('Salom. Men Robot AI man. Sizga qanday yordam bera olaman?',.82);talk.onclick=()=>say('Salom. Men Robot AI man. Bugun siz bilan ishlashga tayyorman.',1);addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});function loop(){requestAnimationFrame(loop);const dt=clock.getDelta();if(mixer)mixer.update(dt);root.rotation.y+=(ry-root.rotation.y)*.08;root.rotation.x+=(rx-root.rotation.x)*.08;cam.position.z+=(dist-cam.position.z)*.08;cam.lookAt(0,.15,0);r.render(s,cam)}loop();</script></body></html>
