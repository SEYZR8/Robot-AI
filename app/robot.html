<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Robot AI 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05070d;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%}.top{position:fixed;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}.top b{letter-spacing:.1em}.status{color:#72f0ae}.buttons{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:8px}.buttons button{padding:11px 14px;border-radius:14px;border:1px solid #3b527e;background:#0b1220e8;color:#fff}</style></head><body><div class="top"><div><b>ROBOT AI</b><br><small>3D HUMANOID</small></div><div class="status">● ONLINE</div></div><div class="buttons"><button onclick="say(1.08)">QIZ OVOZI</button><button onclick="say(.82)">ERKAK OVOZI</button><button onclick="say(1)">SALOM</button></div><canvas id="c"></canvas><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script><script>const c=document.getElementById('c'),r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;const s=new THREE.Scene();s.background=new THREE.Color(0x05070d);const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);cam.position.set(0,1,6);s.add(new THREE.HemisphereLight(0xbdd3ff,0x050812,2.5));let l=new THREE.DirectionalLight(0xffffff,4);l.position.set(3,5,4);s.add(l);let p=new THREE.PointLight(0x397aff,30,12);p.position.set(-3,2,2);s.add(p);let q=new THREE.PointLight(0x9c50ff,18,10);q.position.set(3,1,-2);s.add(q);const g=new THREE.Group();g.position.y=-1.4;s.add(g);let mixer;new THREE.GLTFLoader().load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',x=>{g.add(x.scene);x.scene.scale.setScalar(1.35);mixer=new THREE.AnimationMixer(x.scene);let a=x.animations.find(v=>/idle/i.test(v.name))||x.animations[0];if(a)mixer.clipAction(a).play()});let down=false,x0=0,rot=0;c.onpointerdown=e=>{down=true;x0=e.clientX};c.onpointermove=e=>{if(down){rot+=(e.clientX-x0)*.008;x0=e.clientX}};c.onpointerup=()=>down=false;function say(p){let u=new SpeechSynthesisUtterance('Salom. Men Robot AI man. Sizga qanday yordam bera olaman?');u.lang='uz-UZ';u.pitch=p;u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u)}let clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);if(mixer)mixer.update(clock.getDelta());g.rotation.y+=(rot-g.rotation.y)*.08;cam.lookAt(0,.1,0);r.render(s,cam)}loop();onresize=()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}</script></body></html>
