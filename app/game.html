<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Samarqand Drive — 3D Test</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial;color:#fff;touch-action:none}#game{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:14px;font-weight:700;text-shadow:0 2px 5px #000}.mission{position:absolute;top:58px;left:14px;background:#0009;padding:10px 14px;border-radius:10px}.controls{position:absolute;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:auto}.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px}.btn{border:1px solid #fff5;background:#111b;color:white;border-radius:14px;font-size:24px;margin:3px}.up{grid-column:2}.down{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.actions{display:flex;gap:8px;align-items:end}.actions .btn{width:70px;height:70px}.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.7}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><span>🇺🇿 SAMARQAND DRIVE</span><span id="speed">0 km/soat</span></div><div class="mission">Vazifa: Registon tomon haydang</div><div class="controls"><div class="pad"><button class="btn up" data-k="w">▲</button><button class="btn left" data-k="a">◀</button><button class="btn right" data-k="d">▶</button><button class="btn down" data-k="s">▼</button></div><div class="actions"><button class="btn" data-k="shift">🚗</button><button class="btn" data-k="space">⏹</button></div></div><div class="hint">Telefon: tugmalar • Kamera: ekranni suring</div></div><script src="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.min.js"></script><script src="./game.js"></script></body></html>
