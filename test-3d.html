<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot AI 3D Test</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05070d}canvas{width:100%;height:100%;display:block}.ui{position:fixed;top:16px;left:16px;color:#fff;font:14px system-ui;z-index:2}.ui b{font-size:18px}</style></head><body><div class="ui"><b>ROBOT AI</b><br>3D HUMANOID TEST</div><canvas id="c"></canvas><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script><script>const c=document.getElementById('c'),r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));const s=new THREE.Scene();s.background=new THREE.Color(0x05070d);const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);cam.position.set(0,1,6);s.add(new THREE.HemisphereLight(0xc9dcff,0x060912,2.5));const l=new THREE.DirectionalLight(0xffffff,4);l.position.set(3,5,5);s.add(l);const p=new THREE.PointLight(0x3d7cff,35,12);p.position.set(-3,2,2);s.add(p);const root=new THREE.Group();root.position.y=-1.4;s.add(root);let mixer;new THREE.GLTFLoader().load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',g=>{root.add(g.scene);g.scene.scale.setScalar(1.35);mixer=new THREE.AnimationMixer(g.scene);const a=g.animations.find(x=>/idle/i.test(x.name))||g.animations[0];if(a)mixer.clipAction(a).play()});let clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);if(mixer)mixer.update(clock.getDelta());root.rotation.y=Math.sin(performance.now()*.0004)*.12;cam.lookAt(0,.1,0);r.render(s,cam)}loop();onresize=()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}</script></body></html>
