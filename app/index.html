<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070912"><title>ROBOT AI — Humanoid Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css">
</head>
<body><div class="shell">
<header><div class="brand"><span class="brand-mark">R</span><div><b>ROBOT AI</b><small>HUMANOID INTELLIGENCE</small></div></div><div class="status"><i></i> ONLINE</div><button id="settings">⚙</button></header>
<main><section class="stage"><div class="hud top-left"><span>NEURAL CORE</span><b>ACTIVE</b></div><div class="robot-wrap"><div class="aura"></div><div id="robot" class="robot"><div class="antenna"></div><div class="head"><div class="face"><div class="eyes"><i></i><i></i></div><div class="visor"></div><div class="mouth"></div></div></div><div class="neck"></div><div class="body"><div class="core"></div><div class="shoulder l"></div><div class="shoulder r"></div></div></div></div><div class="hud bottom-right"><span>VOICE ENGINE</span><b id="voiceState">READY</b></div><div class="orbital one"></div><div class="orbital two"></div></section>
<section class="console"><div class="welcome"><span class="eyebrow">YOUR HUMANOID ASSISTANT</span><h1>Salom. Men <em>Robot AI</em>.</h1><p>Texnologiya, dasturlash, IT va kundalik vazifalarda yordam berishga tayyorman.</p></div><div class="chat" id="chat"><div class="msg bot"><div class="avatar">R</div><div><small>ROBOT AI</small><p>Men tayyorman. Menga yozing yoki mikrofon tugmasini bosing.</p></div></div></div><div class="composer"><button class="icon" id="mic" title="Ovozli suhbat">🎙</button><input id="prompt" autocomplete="off" placeholder="Robot AI ga savol bering..."/><button class="send" id="send">➤</button></div><div class="voice-row"><button class="voice active" data-voice="female">♀ Qiz ovozi</button><button class="voice" data-voice="male">♂ Erkak ovozi</button><span id="voiceLabel">Qiz ovozi</span></div><div class="quick"><button data-q="Menga IT bo‘yicha yordam ber">IT yordam</button><button data-q="JavaScript haqida tushuntir">Dasturlash</button><button data-q="Bugungi vazifalarimni rejalashtir">Reja</button><button data-q="Sening imkoniyatlaring nimalar?">Imkoniyatlar</button></div></section></main>
</div><script type="module" src="./app.js"></script></body></html>
