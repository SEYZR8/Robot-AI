<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Samarqand Drive — 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#081018;font-family:Inter,Arial,sans-serif;color:#fff}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:18px;gap:12px}.card{background:rgba(7,14,23,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);border-radius:14px;padding:10px 14px;box-shadow:0 8px 30px #0006}.title{font-weight:800;font-size:18px}.sub{font-size:12px;color:#b8c7d9;margin-top:3px}.mission{position:absolute;left:18px;top:88px;max-width:300px}.money{font-size:18px;font-weight:800}.bar{height:6px;background:#263344;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:82%;background:#7ee787}.hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);text-align:center;color:#d8e3ee}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:'';position:absolute;background:#fff8}.cross:before{width:18px;height:2px;top:8px}.cross:after{height:18px;width:2px;left:8px}.touch{position:fixed;bottom:18px;right:18px;display:grid;grid-template-columns:repeat(3,56px);gap:8px;pointer-events:auto}.touch button{height:56px;border-radius:14px;border:1px solid #ffffff22;background:#0a1522cc;color:#fff;font-size:20px}.touch .wide{grid-column:span 3}.hidden{display:none}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#071019;z-index:10}.loading b{font-size:24px}.loading small{display:block;color:#9fb0c3;margin-top:8px;text-align:center}@media(max-width:600px){.mission{top:82px;max-width:240px}.top{padding:10px}.card{padding:8px 10px}.title{font-size:15px}.sub{font-size:10px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="load" class="loading"><div><b>SAMARQAND DRIVE</b><small>3D shahar yuklanmoqda…</small></div></div>
<div id="hud">
 <div class="top"><div class="card"><div class="title">🇺🇿 Samarqand Drive</div><div class="sub">Erkin shahar • O‘zbekcha</div></div><div class="card"><div class="money">💰 12 500 so‘m</div><div class="sub" id="speed">0 km/soat</div></div></div>
 <div class="mission card"><b>Vazifa: Registon tomon</b><div class="sub">Ko‘k belgiga yetib boring.</div><div class="bar"><i id="hp"></i></div></div>
 <div class="cross"></div>
 <div class="hint">WASD — yurish/haydash • E — mashinaga kirish/chiqish • Shift — tezlik</div>
</div>
<div class="touch"><button data-k="w">▲</button><button data-k="e">E</button><button data-k="shift">⚡</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x87b8df);scene.fog=new THREE.Fog(0x87b8df,120,520);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,900);camera.position.set(0,7,12);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.getElementById('game').appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xb9dcff,0x4c3928,2.1);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff1cf,3.2);sun.position.set(-100,150,80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-220;sun.shadow.camera.right=220;sun.shadow.camera.top=220;sun.shadow.camera.bottom=-220;scene.add(sun);
const mat=(c,r=0.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),mat(0x8d7657));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=mat(0x262a2e,.95),sideMat=mat(0xb0a58d),white=mat(0xe8e4d8,.7),green=mat(0x3c7042),blue=mat(0x1686c4,.65,.05),brick=mat(0x9b5a3d),cream=mat(0xe5c79b),gold=mat(0xd8a62d,.45,.2);
function box(x,y,z,w,h,d,m,sh=true){let q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y+h/2,z);q.castShadow=sh;q.receiveShadow=true;scene.add(q);return q}
function road(x,z,w,d){box(x,.03,z,w,.08,d,roadMat,false);if(w>d){for(let i=-w/2+6;i<w/2;i+=12)box(x+i,.08,z,.18,.015,3,white,false)}else{for(let i=-d/2+6;i<d/2;i+=12)box(x,.08,z+i,3,.015,.18,white,false)}}
// Main streets
road(0,0,22,500);road(0,0,500,22);road(-105,0,16,500);road(105,0,16,500);road(0,-105,500,16);road(0,105,500,16);
function tree(x,z,s=1){let g=new THREE.Group();let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.3*s,2*s,8),brick);trunk.position.y=s;g.add(trunk);let crown=new THREE.Mesh(new THREE.SphereGeometry(1.5*s,12,10),green);crown.position.y=2.7*s;crown.castShadow=true;g.add(crown);g.position.set(x,0,z);scene.add(g)}
function building(x,z,w,d,h,accent=false){let b=box(x,0,z,w,h,d,accent?cream:mat((Math.random()>.5?0xc8ad87:0xb99b75)),true);let roof=box(x,h,z,w*.96,.25,d*.96,accent?blue:brick,true);for(let yy=2;yy<h-1;yy+=2.3){for(let xx=-w/2+1.2;xx<w/2-1;xx+=2.2){let win=box(x+xx,yy,z-d/2-.03,.75,.9,.06,blue,false);win.material.emissive=new THREE.Color(0x164e72);}}return b}
// Procedural Samarqand-style neighborhoods
for(let x=-190;x<=190;x+=26)for(let z=-190;z<=190;z+=26){if(Math.abs(x)<18||Math.abs(z)<18)continue;if(Math.random()<.82){let w=12+Math.random()*9,d=12+Math.random()*9,h=5+Math.random()*15;building(x+(Math.random()-.5)*5,z+(Math.random()-.5)*5,w,d,h,Math.random()<.12)}}
for(let i=0;i<120;i++){let x=(Math.random()-.5)*430,z=(Math.random()-.5)*430;if(Math.abs(x)<15||Math.abs(z)<15)continue;tree(x,z,.65+Math.random()*.65)}
// Registon-inspired landmark, original low-poly interpretation
function monument(){let g=new THREE.Group();g.position.set(72,0,-72);scene.add(g);let p=box(0,0,0,92,1,64,cream);g.add(p);for(let i=-1;i<=1;i++){let wing=box(i*30,1,0,24,20,9,brick);g.add(wing);let dome=new THREE.Mesh(new THREE.SphereGeometry(7,20,12,0,Math.PI*2,0,Math.PI/2),blue);dome.position.set(i*30,21,0);dome.castShadow=true;g.add(dome);let arch=box(i*30,4,-5,10,14,1,gold);g.add(arch)}for(let x=-40;x<=40;x+=8){let d=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.8,25,12),blue);d.position.set(x,13,27);g.add(d)} }
monument();
// Player and vehicle
const player=new THREE.Group();const body=box(0,0,0,1.1,1.8,.65,mat(0x263c59));body.position.y=.9;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),mat(0xd5a17b));head.position.y=2.15;player.add(head);player.position.set(0,0,30);scene.add(player);
const car=new THREE.Group();const carBody=box(0,.5,0,2.2,.65,4.4,mat(0x1d4f8a,.4,.35));carBody.position.y=.5;car.add(carBody);const cabin=box(0,1.15,.1,1.8,.55,2.1,mat(0x101820,.25,.2));cabin.material.transparent=true;cabin.material.opacity=.82;car.add(cabin);for(const x of[-1,1])for(const z of[-1.45,1.45]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,16),mat(0x111111,.8));w.rotation.z=Math.PI/2;w.position.set(x,0.45,z);car.add(w)}car.position.set(0,0,30);car.visible=false;scene.add(car);
let driving=false,heading=0,speed=0;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e'&&nearCar())toggleCar()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function nearCar(){return player.position.distanceTo(car.position)<5}
function toggleCar(){driving=!driving;car.visible=driving;player.visible=!driving;if(driving){car.position.copy(player.position);car.position.y=0;}}
document.querySelectorAll('.touch button').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',()=>keys[k]=true);b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointercancel',()=>keys[k]=false);});
function update(dt){if(driving){let accel=keys.w?.00055:keys.s?-.00035:0;speed+=(accel*dt*60);speed*=Math.pow(.985,dt*60);speed=THREE.MathUtils.clamp(speed,-.22,.75);if(keys.shift)speed*=1.35;let steer=(keys.a?1:0)-(keys.d?1:0);heading+=steer*speed*.035*dt*60;car.rotation.y=heading;car.position.x+=Math.sin(heading)*speed*dt*60;car.position.z+=Math.cos(heading)*speed*dt*60;player.position.copy(car.position)}else{let v=new THREE.Vector3((keys.d?1:0)-(keys.a?1:0),0,(keys.s?1:0)-(keys.w?1:0));if(v.length()){v.normalize().multiplyScalar((keys.shift?.22:.12)*dt*60);player.position.add(v);heading=Math.atan2(v.x,v.z);player.rotation.y=heading}}}
let camTarget=new THREE.Vector3();function cameraFollow(dt){let p=driving?car:player;let behind=new THREE.Vector3(Math.sin(heading)*-10,6.2,Math.cos(heading)*-10);camTarget.copy(p.position).add(behind);camera.position.lerp(camTarget,1-Math.pow(.001,dt));let look=p.position.clone();look.y+=1.4;camera.lookAt(look)}
const clock=new THREE.Clock();function loop(){let dt=Math.min(clock.getDelta(),.05);update(dt);cameraFollow(dt);document.getElementById('speed').textContent=Math.round(Math.abs(speed)*150)+' km/soat';document.getElementById('hp').style.width=(82+Math.sin(performance.now()/900)*2)+'%';renderer.render(scene,camera);requestAnimationFrame(loop)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setTimeout(()=>document.getElementById('load').remove(),900);loop();
</script>
</body></html>
